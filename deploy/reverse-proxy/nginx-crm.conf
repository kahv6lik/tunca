# Gezegen CRM — mevcut Nginx reverse proxy'ye eklenecek sanal sunucu blokları.
# Bu blokları mevcut nginx yapılandırmanıza (ör. /root/nginx.conf) ekleyin,
# ardından: docker exec <nginx> nginx -t && docker exec <nginx> nginx -s reload
#
# Sertifikayı almak için (mevcut certbot volume'leriyle):
#   docker run --rm \
#     -v <certbot_data_volume>:/etc/letsencrypt \
#     -v <certbot_www_volume>:/var/www/certbot \
#     certbot/certbot certonly --webroot -w /var/www/certbot \
#     -d crm.ORNEK.com --email siz@ornek.com --agree-tos --no-eff-email --non-interactive

# HTTP: ACME doğrulaması + HTTPS'e yönlendirme
server {
    listen 80;
    server_name crm.screenbite.com.tr;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS: uygulamaya ters proxy
server {
    listen 443 ssl;
    server_name crm.screenbite.com.tr;

    ssl_certificate     /etc/letsencrypt/live/crm.screenbite.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.screenbite.com.tr/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://gezegen-crm-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
