# Gezegen CRM — Docker + Nginx + Certbot (Let's Encrypt HTTPS)
# Değişkenler deploy.env dosyasından gelir (deploy.sh tarafından yüklenir).

services:
  db:
    image: postgres:16-alpine
    container_name: gezegen-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-gezegen}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanımlı olmalı (deploy.env)}"
      POSTGRES_DB: "${POSTGRES_DB:-gezegen}"
    volumes:
      - gezegen-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gezegen} -d ${POSTGRES_DB:-gezegen}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - gezegen

  app:
    build: .
    image: gezegen-crm:latest
    container_name: gezegen-crm-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # PostgreSQL (Faz 2) — RLS ile kiracı izolasyonu veritabanı katmanında
      DATABASE_URL: "postgresql://${POSTGRES_USER:-gezegen}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gezegen}?schema=public"
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET tanımlı olmalı (deploy.env)}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@gezegen.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
      ADMIN_NAME: "${ADMIN_NAME:-Sistem Yöneticisi}"
      # Dosya ekleri (Faz 17 / A1) — konteyner içindeki depo dizini.
      # Kalıcılığı aşağıdaki `gezegen-dosya` volume'ü sağlar; volume
      # bağlanmazsa her sürümde ekler KAYBOLUR.
      DOSYA_DIZIN: "/veri/dosya"
      # Adresten koordinat üretimi (Faz 17 / A3). TANIMSIZSA özellik kapalıdır
      # ve koordinat elle girilir — sessizce ücretli çağrı yapılmaz.
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
      # Faz 21 — AI. Tanımsızsa AI özellikleri KAPALIDIR (uygulama çalışır).
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-}"
    volumes:
      - gezegen-dosya:/veri/dosya
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - gezegen

  nginx:
    image: nginx:alpine
    container_name: gezegen-crm-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    networks:
      - gezegen

  certbot:
    image: certbot/certbot
    container_name: gezegen-crm-certbot
    restart: unless-stopped
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    # Sertifikaları 12 saatte bir yenilemeyi dener
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    networks:
      - gezegen

volumes:
  gezegen-pgdata:
  # Dosya ekleri (Faz 17). Veritabanı yedeğinde DEĞİLDİR; ayrı yedeklenir —
  # adımlar docs/DEPLOY.md içinde.
  gezegen-dosya:

networks:
  gezegen:
